tl_qgis_map:
  deletion_disabled: Löschen nicht möglich. Der Datensatz wird verwendet.

  type_legend: Benennung der Karte
  title:
    - Titel der Karte
    - Geben Sie hier einen Titel für die Karten-Definition ein.

  olconfig_legend: OpenLayers-Konfiguration
  addOpenLayers:
    - OpenLayers automatisch laden (experimentell)
    - Aktivieren Sie diese Funktion, wenn OpenLayers automatisch geladen werden soll. Hinweis Sie sollten OpenLayers immer automatisch laden lassen. Diese Option ist dafür gedacht, das Laden zu deaktivieren, insofern Sie eine eigene Version von OpenLayers manuell laden möchten.
  olDistVersion:
    - Welche Version laden?
    - Hier können Sie zurzeit zwischen zwei Versionen wählen. Sie können auch im Ordner files eine eigene abweichende Version installieren und hier dann auswählen.
  loadOpenLayersJs:
    - Javascript-Bibliothek laden?
    - Nur die Javascript-Komponente laden?
  loadOpenLayersCss:
    - CSS-Bibliothek laden?
    - Nur die CSS-Komponente laden?
  addOpenLayersExt:
    - OpenLayers-Erweiterung olext laden?
  olExtDistVersion:
    - Welche Version laden?
    - Hier können Sie zurzeit nur eine Version wählen. Sie können auch im Ordner files eine eigene abweichende Version installieren und hier dann auswählen.
  loadOpenLayersExtJs:
    - Javascript-Bibliothek laden?
    - Nur die Javascript-Komponente laden?
  loadOpenLayersExtCss:
    - CSS-Bibliothek laden?
    - Nur die CSS-Komponente laden?
  useCompass:
    - olext-Kompass laden
    - Lädt und aktiviert den Kompass (olext.compass).

  mapconfig_legend: Karten-Overlay-Konfiguration
  showCrsFE:
    - Cursor-Koordinaten am Frontend anzeigen
    - Aktiviert die Anzeige der aktuellen Koorinaten unter dem Mauscrusor.
  showScopeFE:
    - Scope am Frontend anzeigen
    - Aktiviert die Anzeige des aktuellen Scopes zu Testzwecken.
  showCrsBE:
    - Cursor-Koordinaten am Backend anzeigen
    - Aktiviert die Anzeige der aktuellen Koorinaten unter dem Mauscrusor.
  showScopeBE:
    - Scope am Backend anzeigen
    - Aktiviert die Anzeige des aktuellen Scopes zu Testzwecken.


  layers_legend: Welche Ebenen (Layer) sollen auf der Karte dargestellt werden?
  layers:
    - Ebenen
    - Wählen Sie hier alle Ebenen, die auf der Karte dargestellt werden sollen.
      Sie müssen die Ebenen zuvor unter dem gleichnamigen Menüpunkt definiert haben. 
      <b>Achten</b> Sie bitte darauf, dass die Ebenen auch sichtbar=published gesetzt sind. 
      Die Ebenen werden ihrer Reihenfolge nach aufsteigend übereinander gezeichnet. 
      Daher sollte die erste Ebene immer die BaseMap OSM sein. Diese wird zuerst gezeichnet, liegt also ganz unten. 
      Die Einstellung &raquo;Zoom&laquo; bezeichnet hier keinen Wert, sondern ein Verhalten. 
      <ul><li><b>Zoom auf Parameter</b> bedeutet, dass die unten stehenden Parameter bei der Darstellung der Karte am Frontend 
      verwendet werden.</li>
      <li><b>Zoom auf Extent dieser Ebene</b> bedeutet, dass die unten stehenden Parameter bei der Darstellung der Karte am Frontend
      <b>nicht</b> verwendet werden. Stattdessen wird unmittelbar beim Darstellen der Karte der Umfang (Extent) 
      der markierten Ebene (Layer) berechnet und die Karte auf diesen Umfang hin vergrößert und ausgerichtet.</li>
      <li><b>Zoom auf Extent eines Features</b> bedeutet, dass die unten stehenden Parameter bei der Darstellung der Karte am Frontend
      <b>nicht</b> verwendet werden. Stattdessen wird ein Feature auf diesem Layer gesucht, dessen Eigenschaft auf Zoom .</li>
      </ul>
  layer_fields:
    layer:
      - Ebene
    style:
      - Style
    zoom:
      - Zoom
    zoom_options:
      params: auf Parameter
      layer: auf Extent dieser Ebene
      feature: auf Extent eines Features

  parameters_legend: Karten-Parameter
  map:
    - Kartenansicht
    - Verwenden Sie den Mausziger auf der  Karte, um die Parameter automatisch zu setzen.
  center:
    - Mittelpunkt der Karte EPSG:3857
    - Beim Verschieben der Karte wird hier der aktuelle Mittelpunkt angezeigt.
  extent:
    - Bounding Box (Extent)
    - Die Bounding Box über alle Kartenelemente.
    - Zoom to Extent
  zoom:
    - Aktueller Zoom-Level
    - Dieser Wert wird automatisch gesetzt, wenn Sie die Kartenansicht ändern.
  mapCrs:
    - Koordinatensystem der Karte
    - Hier können Sie das Koordinatensystem der Karte setzen. Diese Einstellung hat Vorrang vor allen anderen Koordinaten-Einstellungen untergeordneter Objekte.
  mapPadding:
    - Rahmenbereich um die BoundingBox (extent padding)
    - Geben Sie hier ein Array der Form [oben, rechts, unten, links] in Pixeln ein.